name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore LaserMeshStudio.sln
      - run: dotnet build LaserMeshStudio.sln -c Release --no-restore
      - run: dotnet test LaserMeshStudio.sln -c Release --no-build
